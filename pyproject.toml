[project]
name = "kbc-artifact-hub"
version = "0.19.0"
description = "Keboola App that hosts HTML+JS artifacts under public URLs, backed by Keboola Storage Files"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "kbcstorage>=0.9.0",
    "markdown-it-py>=3.0.0",
    "linkify-it-py>=2.0.0",
    "mdit-py-plugins>=0.4.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "markdownify>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
    # SUP-100-001: the CI and release dependency audit runs `uv run pip-audit`
    # rather than `uvx pip-audit`, so the tool that decides whether the
    # production graph is clean is itself pinned by uv.lock instead of being
    # resolved fresh from the index on every privileged run.
    "pip-audit>=2.9.0",
    # tests/test_review100_release_controls.py parses .github/workflows/*.yml
    # structurally (pinned actions, per-job permissions, the gates the release
    # job must re-run) rather than grepping it. Declared explicitly instead of
    # leaning on pip-audit happening to pull it in.
    "pyyaml>=6.0",
]

[tool.uv]
# kbcstorage 0.9.5 (the newest release) declares urllib3<2.0.0, which is the
# single constraint keeping the production graph on urllib3 1.26.20 -- a
# version with five current advisories, the highest of which is only fixed in
# 2.7.0. The pin is stale rather than substantive: kbcstorage never imports
# urllib3, it talks HTTP through requests and boto3, and both of those declare
# urllib3<3. botocore and requests already allow 2.x here.
#
# Revisit when kbcstorage relaxes its own pin; this override exists only to
# stop a transitive dependency's hygiene constraint from holding a known
# vulnerable version in a deployed image.
override-dependencies = ["urllib3>=2.7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
