name: Release

# Fires on a version tag. Runs the whole suite, the compile check, the
# production dependency audit and the version-parity check first, so a tag
# that does not match pyproject.toml and the changelog -- or that points at
# code which never reached protected `main` -- never becomes a release. Then
# publishes the two instruction documents as release assets with SHA256SUMS,
# and attests them with GitHub artifact attestations: anyone can later prove a
# downloaded AGENT.md was built by *this* workflow from *this* tag with plain
# `gh attestation verify`. The live /agent endpoint is for reading; installing
# is done from these assets (README, "Install").
#
# SUP-100-001: the gates below are deliberately re-run *here*, in the job that
# holds the write and attestation permissions, instead of being trusted to
# have run in CI. A tag can be pushed at any commit, and CI running green on
# some other commit says nothing about this one. Third-party actions are
# pinned to full commit SHAs so a retagged upstream release cannot change what
# the privileged job executes.
on:
  push:
    tags: ["v*"]

# Deny by default; the one job that needs more says so explicitly.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload its assets
      id-token: write      # sign the attestation with the workflow's identity
      attestations: write  # store it in the repository's attestation store
    steps:
      # Full history: the ancestry proof below needs real merge-base data, which
      # the default shallow clone does not have.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      # A `v*` tag can be created on any commit by anyone with write access.
      # The attestation this workflow issues would then vouch for code that
      # never passed review on `main`. Refuse unless the tagged commit is an
      # ancestor of the protected branch.
      - name: The tagged commit must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not on origin/main. Releases are cut from merged, reviewed commits only."
            exit 1
          fi
          echo "$GITHUB_SHA is on origin/main"

      - name: Tag, package version and changelog must agree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          LOG="v$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## ([0-9.]+).*/\1/')"
          # The Claude Code plugin manifests: an installed plugin only updates
          # when this version moves, so a release that forgets them is invisible.
          PLUGIN="v$(jq -r .version .claude-plugin/plugin.json)"
          MARKET="v$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
          echo "tag=$TAG pyproject=$PKG changelog=$LOG plugin=$PLUGIN marketplace=$MARKET"
          test "$TAG" = "$PKG" -a "$TAG" = "$LOG" -a "$TAG" = "$PLUGIN" -a "$TAG" = "$MARKET"

      - name: Test suite
        run: uv run pytest tests/ -q

      - name: Compile on the deployed interpreter
        run: uv run python -m py_compile src/*.py

      - name: Export the production lock
        run: uv export --no-dev --no-emit-project --format requirements-txt -o requirements-prod.txt

      - name: Audit the production dependency graph
        run: uv run pip-audit -r requirements-prod.txt --disable-pip

      - name: Assemble the release documents
        run: |
          set -euo pipefail
          mkdir -p dist
          cp agents/artifact-hub.md dist/AGENT.md
          cp skills/artifact-publisher/SKILL.md dist/SKILL.md
          (cd dist && sha256sum AGENT.md SKILL.md > SHA256SUMS && cat SHA256SUMS)

      - name: Attest the documents
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/AGENT.md
            dist/SKILL.md
            dist/SHA256SUMS

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Title and notes come from this version's changelog section.
          uv run python - "$TAG" <<'PY'
          import re, sys, pathlib
          tag = sys.argv[1]; version = tag.lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## {re.escape(version)}[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          heading = re.search(rf"^## {re.escape(version)}\s*—\s*([^(\n]*)", text, re.M)
          title = f"{tag} — {heading.group(1).strip()}" if heading else tag
          body = (m.group(1).strip() if m else "") + (
              "\n\n---\nAssets: `AGENT.md`, `SKILL.md`, `SHA256SUMS`. "
              "Verify with `gh attestation verify <file> --repo padak/kbc_ai_artifact`."
          )
          pathlib.Path("dist/TITLE").write_text(title, encoding="utf-8")
          pathlib.Path("dist/NOTES.md").write_text(body, encoding="utf-8")
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AGENT.md dist/SKILL.md dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/AGENT.md dist/SKILL.md dist/SHA256SUMS \
              --verify-tag --title "$(cat dist/TITLE)" --notes-file dist/NOTES.md
          fi
